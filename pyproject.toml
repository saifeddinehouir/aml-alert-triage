[project]
name = "aml-alert-triage"
version = "0.1.0"
description = "AML alert triage: sanctions screening, red-flag rules and audited LLM case summaries"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "rapidfuzz>=3.6", "anthropic>=0.40", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
